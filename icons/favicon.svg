<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="chipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>

  <!-- Outer Ring Glow -->
  <rect x="16" y="16" width="480" height="480" rx="98" fill="none" stroke="#38bdf8" stroke-opacity="0.25" stroke-width="4"/>

  <!-- Main Card Shape -->
  <g filter="url(#shadow)">
    <rect x="76" y="146" width="360" height="220" rx="28" fill="url(#cardGrad)"/>
    <!-- Card Top Magnetic Stripe / Gloss Effect -->
    <path d="M76 190 H436 V210 H76 Z" fill="#0f172a" fill-opacity="0.35"/>
    <!-- EMV Chip -->
    <rect x="116" y="240" width="60" height="46" rx="8" fill="url(#chipGrad)"/>
    <path d="M146 240 V286 M116 263 H176" stroke="#ca8a04" stroke-width="2"/>
    <!-- Contactless Wave -->
    <path d="M210 248 A18 18 0 0 1 210 278" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
    <path d="M224 240 A30 30 0 0 1 224 286" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-opacity="0.8"/>
    <path d="M238 232 A42 42 0 0 1 238 294" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-opacity="0.5"/>
    <!-- Finance Upward Arrow Indicator -->
    <circle cx="370" cy="270" r="32" fill="#10b981"/>
    <path d="M370 284 V256 M358 268 L370 256 L382 268" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Title Monogram Tag -->
  <text x="256" y="420" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="800" font-size="34" fill="#f8fafc" letter-spacing="2">GASTEI &amp; AGORA?</text>
</svg>
