<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sem Conexão | Gastei & Agora?</title>
    <script>
        (function() {
            try {
                var theme = localStorage.getItem('gastei_agora_theme') || 'dark';
                document.documentElement.setAttribute('data-theme', theme);
            } catch(e) {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        })();
    </script>
    <style>
        :root {
            --bg-color: #0f172a;
            --surface-color: #1e293b;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --primary-color: #38bdf8;
            --primary-hover: #0284c7;
            --border-color: #334155;
            --accent-glow: rgba(56, 189, 248, 0.15);
        }

        [data-theme="light"] {
            --bg-color: #f1f5f9;
            --surface-color: #ffffff;
            --text-primary: #0f172a;
            --text-secondary: #64748b;
            --primary-color: #0284c7;
            --primary-hover: #0369a1;
            --border-color: #e2e8f0;
            --accent-glow: rgba(2, 132, 199, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            text-align: center;
            transition: background-color 0.25s ease, color 0.25s ease;
        }

        .offline-card {
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 2.5rem 2rem;
            max-width: 440px;
            width: 100%;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
            position: relative;
            overflow: hidden;
        }

        .offline-card::before {
            content: '';
            position: absolute;
            top: -50px;
            left: 50%;
            transform: translateX(-50%);
            width: 140px;
            height: 140px;
            background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
        }

        .offline-icon {
            font-size: 3.5rem;
            margin-bottom: 1.25rem;
            display: inline-block;
            animation: pulse-slow 2.5s infinite ease-in-out;
        }

        @keyframes pulse-slow {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.08); opacity: 0.85; }
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 800;
            margin-bottom: 0.75rem;
            letter-spacing: -0.02em;
        }

        p {
            color: var(--text-secondary);
            font-size: 0.95rem;
            line-height: 1.55;
            margin-bottom: 1.75rem;
        }

        .btn-reload {
            background-color: var(--primary-color);
            color: #ffffff;
            border: none;
            border-radius: 12px;
            padding: 0.85rem 1.75rem;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            box-shadow: 0 4px 14px rgba(56, 189, 248, 0.35);
        }

        .btn-reload:hover {
            background-color: var(--primary-hover);
            transform: translateY(-2px);
        }

        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-top: 1.5rem;
            background: rgba(148, 163, 184, 0.1);
            padding: 0.35rem 0.85rem;
            border-radius: 9999px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: #ef4444;
            border-radius: 50%;
        }
    </style>
</head>
<body>
    <div class="offline-card">
        <div class="offline-icon">📡</div>
        <h1>Sem Conexão com a Internet</h1>
        <p>Você está offline no momento. O <strong>Gastei & Agora?</strong> reconectará e sincronizará seus dados automaticamente assim que sua rede voltar.</p>
        <button class="btn-reload" onclick="window.location.reload()">
            <span>🔄</span> Tentar Reconectar
        </button>
        <br>
        <div class="status-pill">
            <span class="status-dot"></span>
            <span>Aguardando sinal de rede...</span>
        </div>
    </div>

    <script>
        // Reconexão reativa automática
        window.addEventListener('online', function() {
            window.location.reload();
        });
    </script>
</body>
</html>
